name: NHTSA CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nhtsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nhtsa_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nhtsa_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t nhtsa-api .

      - name: Run Docker container
        run: |
          docker run -d \
            --name nhtsa-api-smoke \
            -e DATABASE_URL="$DATABASE_URL" \
            -p 8000:8000 \
            nhtsa-api

      - name: Wait for API
        run: |
          for i in {1..10}; do
            if curl --fail http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm -f nhtsa-api-smoke
